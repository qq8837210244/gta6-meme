<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTA 6 Meme - make.fun</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #080312;
    font-family: 'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
    position: relative;
    user-select: none;
  }

  /* Full canvas SVG */
  #scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 1024px;
    height: 1024px;
  }

  /* Top and Bottom Gradient Scrims for text contrast */
  .scrim-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 1024px;
    height: 200px;
    background: linear-gradient(180deg, rgba(6, 2, 14, 0.95) 0%, rgba(8, 3, 18, 0.85) 60%, rgba(10, 4, 22, 0) 100%);
    pointer-events: none;
    z-index: 10;
  }

  .scrim-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1024px;
    height: 210px;
    background: linear-gradient(0deg, rgba(5, 2, 12, 0.98) 0%, rgba(7, 3, 16, 0.88) 60%, rgba(9, 4, 20, 0) 100%);
    pointer-events: none;
    z-index: 10;
  }

  /* Meme Text Styling with paint-order: stroke fill so stroke is outside */
  .meme-text {
    position: absolute;
    left: 20px;
    right: 20px;
    text-align: center;
    font-weight: 900;
    text-transform: uppercase;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 1.15;
    z-index: 20;
    paint-order: stroke fill;
    -webkit-text-stroke: 8px #000000;
    text-shadow: 
      0 0 20px rgba(0, 0, 0, 0.95),
      0 6px 16px rgba(0, 0, 0, 0.95);
  }

  .top-text {
    top: 72px;
    font-size: 54px;
  }

  .top-text .highlight-years {
    color: #ffe600;
  }

  .bottom-text {
    bottom: 38px;
    font-size: 45px;
    letter-spacing: 1.5px;
  }

  .bottom-text .highlight-agent {
    color: #00f0ff;
  }

  .bottom-text .highlight-heists {
    color: #39ff14;
  }

  .bottom-text .highlight-makefun {
    color: #ff2a9d;
  }

  /* Official make.fun logo badge in top right corner */
  .brand-badge {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 25;
    background: rgba(18, 9, 30, 0.88);
    border: 1.5px solid rgba(255, 42, 157, 0.6);
    border-radius: 20px;
    padding: 6px 14px 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 42, 157, 0.35);
  }

  .brand-badge svg {
    display: block;
  }

  .brand-badge span {
    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
</style>
</head>
<body>

  <!-- Contrast Scrims -->
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <!-- Official make.fun Logo Badge in Top Right -->
  <div class="brand-badge">
    <svg width="26" height="26" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15.1" fill="#c41c83" stroke="#0b0d12" stroke-width="1.8"/>
      <g transform="translate(3.858 3.202) scale(0.79)">

        <path d="M19.3 9.8Q19.732 11.168 21.1 11.6Q19.732 12.032 19.3 13.4Q18.868 12.032 17.5 11.6Q18.868 11.168 19.3 9.8z" fill="#0b0d12"/>
        <circle cx="26.5" cy="13.4" r="5.5" fill="#0b0d12"/>
        <circle cx="26.5" cy="13.4" r="3.8" fill="#c41c83"/>
        <path d="M26.926 11.395L27.154 12.811L28.539 13.186L27.262 13.84L27.334 15.273L26.317 14.261L24.977 14.772L25.625 13.492L24.725 12.375L26.142 12.596z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"/>
        <circle cx="24.9" cy="19.6" r="4" fill="#0b0d12"/>
        <circle cx="24.9" cy="19.6" r="2.3" fill="#ffffff"/>
      </g>
    </svg>
    <span>make.fun</span>
  </div>

  <!-- Top Meme Caption -->
  <div class="meme-text top-text">
    Me waiting <span class="highlight-years">13 years</span> for GTA 6
  </div>

  <!-- Bottom Meme Caption -->
  <div class="meme-text bottom-text">
    <span class="highlight-agent">My AI agent:</span> already did the <span class="highlight-heists">heists</span> on <span class="highlight-makefun">make.fun</span>
  </div>

  <!-- Vector Scene -->
  <svg id="scene" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sky Gradient: 80s Deep Neon Synthwave -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#070212"/>
        <stop offset="28%" stop-color="#1d0834"/>
        <stop offset="50%" stop-color="#500e4b"/>
        <stop offset="70%" stop-color="#9a1460"/>
        <stop offset="85%" stop-color="#e23370"/>
        <stop offset="100%" stop-color="#ff9e50"/>
      </linearGradient>

      <!-- Retro Sun Gradient -->
      <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff875"/>
        <stop offset="25%" stop-color="#ffa712"/>
        <stop offset="60%" stop-color="#ff1279"/>
        <stop offset="100%" stop-color="#b00078"/>
      </linearGradient>

      <!-- Ocean Gradient -->
      <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff6b68"/>
        <stop offset="20%" stop-color="#801053"/>
        <stop offset="50%" stop-color="#2a0538"/>
        <stop offset="100%" stop-color="#10021c"/>
      </linearGradient>

      <!-- Wet Asphalt Road Gradient -->
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#140822"/>
        <stop offset="30%" stop-color="#1c0c2e"/>
        <stop offset="65%" stop-color="#12061e"/>
        <stop offset="100%" stop-color="#080212"/>
      </linearGradient>

      <!-- Glossy Pink Sports Car Body Gradient -->
      <linearGradient id="carBodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff66ba"/>
        <stop offset="18%" stop-color="#ff188c"/>
        <stop offset="55%" stop-color="#d10873"/>
        <stop offset="100%" stop-color="#70013b"/>
      </linearGradient>

      <!-- Windshield / Sunglasses Mirror Glass Gradient -->
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.85"/>
        <stop offset="40%" stop-color="#ff2e9b" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#1d0738" stop-opacity="0.9"/>
      </linearGradient>

      <!-- Underglow Radial Gradient -->
      <radialGradient id="underglowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00f6ff" stop-opacity="1"/>
        <stop offset="35%" stop-color="#ff00a0" stop-opacity="0.7"/>
        <stop offset="70%" stop-color="#8800ff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- Glow Filters -->
      <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
        <feMerge>
          <feMergeNode in="b2"/>
          <feMergeNode in="b1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
        <feMerge>
          <feMergeNode in="b2"/>
          <feMergeNode in="b1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="wetSheen" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5 22"/>
      </filter>
    </defs>

    <!-- ================= 1. SKY & RETRO SUN ================= -->
    <rect x="0" y="0" width="1024" height="570" fill="url(#skyGrad)"/>

    <!-- Retro Twinkle Stars -->

      <polygon points="840,174 842,179 847,179 843,182 845,187 840,184 835,187 837,182 833,179 838,179" fill="#ff70bd" opacity="0.85"/>
    </g>

    <!-- Huge 80s Sun with Horizontal Venetian Slices -->
    <g transform="translate(680, 390)">
      <!-- Outer Sun Glow -->
      <circle cx="0" cy="0" r="180" fill="url(#sunGrad)" opacity="0.35" filter="url(#neonPink)"/>
      <!-- Solid Top Semi-Circle -->

      <!-- Sliced Lower Half -->
      <path d="M -154,12 A 155,155 0 0,0 154,12 L 154,23 A 155,155 0 0,1 -154,23 Z" fill="url(#sunGrad)"/>
      <path d="M -150,35 A 155,155 0 0,0 150,35 L 150,48 A 155,155 0 0,1 -150,48 Z" fill="url(#sunGrad)"/>
      <path d="M -143,62 A 155,155 0 0,0 143,62 L 143,77 A 155,155 0 0,1 -143,77 Z" fill="url(#sunGrad)"/>
      <path d="M -132,93 A 155,155 0 0,0 132,93 L 132,110 A 155,155 0 0,1 -132,110 Z" fill="url(#sunGrad)"/>
      <path d="M -115,126 A 155,155 0 0,0 115,126 L 115,146 A 155,155 0 0,1 -115,146 Z" fill="url(#sunGrad)"/>
    </g>

    <!-- Calm Ocean Horizon & Sun Reflection -->
    <rect x="0" y="475" width="1024" height="60" fill="url(#oceanGrad)"/>
    <ellipse cx="680" cy="490" rx="160" ry="10" fill="#ffa85c" opacity="0.7" filter="url(#wetSheen)"/>
    <ellipse cx="680" cy="510" rx="200" ry="14" fill="#ff1f7d" opacity="0.55" filter="url(#wetSheen)"/>

    <!-- ================= 2. OCEAN DRIVE ART DECO BUILDINGS ================= -->
    <g id="skyline-buildings">

      <g fill="#140624">
        <rect x="0" y="360" width="50" height="150"/>

        <rect x="56" y="495" width="9" height="14"/>

      <!-- Hotel 2: Grand Deco Palace with "PARADISE" Sign -->
      <path d="M 90,365 L 205,365 L 205,535 L 90,535 Z" fill="#200a3d" stroke="#00f6ff" stroke-width="3"/>
      <!-- Eyebrows / Architectural Ridges -->
      <path d="M 85,398 L 210,398" stroke="#ff00a0" stroke-width="4.5"/>
      <path d="M 85,445 L 210,445" stroke="#ff00a0" stroke-width="4.5"/>
      <path d="M 85,488 L 210,488" stroke="#ff00a0" stroke-width="4.5"/>
      <!-- Rooftop Neon Sign -->
      <rect x="105" y="332" width="85" height="28" rx="6" fill="#110421" stroke="#ff00aa" stroke-width="2.5"/>
      <text x="147" y="352" fill="#ff1493" font-size="13" font-weight="900" font-family="'Impact', sans-serif" text-anchor="middle" filter="url(#neonPink)">PARADISE</text>

    <!-- ================= 3. TROPICAL PALM TREES ================= -->

      <!-- Palm Tree 1 (Midground left) -->
      <path d="M 220,535 Q 235,430 210,340 Q 230,430 235,535 Z" fill="#0a0314"/>

    <!-- ================= 4. WET ROAD & GLORIOUS REFLECTIONS ================= -->
    <rect x="0" y="530" width="1024" height="494" fill="url(#roadGrad)"/>

    <!-- Wet Neon Reflection Pillars on Asphalt -->
    <g filter="url(#wetSheen)">
      <rect x="25" y="540" width="30" height="280" fill="#00f6ff" opacity="0.4"/>
      <rect x="45" y="540" width="35" height="250" fill="#ff00aa" opacity="0.5"/>
      <rect x="120" y="535" width="55" height="270" fill="#ff00a0" opacity="0.55"/>
